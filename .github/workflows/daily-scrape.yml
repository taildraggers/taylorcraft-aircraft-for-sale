# Scrapes Barnstormers.com for Taylorcraft listings once a day.
name: Daily Taylorcraft Listings Scrape

on:
  schedule:
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install --with-deps chromium

      - name: Run scraper
        run: python main.py

      - name: Commit and push updated listings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Taylorcraft listings ($(date -u +'%Y-%m-%d'))"
            # The branch may have moved since this run checked it out (a code
            # push mid-run, or a re-run of an older attempt), so replay the
            # fresh page on top of the latest commit first; -X theirs keeps
            # this run's page if another run changed it too.
            git pull --rebase -X theirs origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
